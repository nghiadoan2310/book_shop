server:
  port: 8093
  servlet:
    context-path: /chat

spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/chat-service?authSource=admin
      auto-index-creation: true

socketio:
  port: 8099

app:
  services:
    profile:
      url: http://localhost:8081/profile
    identity:
      url: http://localhost:8080/identity